function UrlGuide(){
  const base = window.location.origin;
  const baseStaff = window.location.origin + window.location.pathname;
  const formUrl    = base + '/nail_form.html';
  const studentUrl = baseStaff;

  const copy = (url, label) => {
    navigator.clipboard?.writeText(url)
      .then(()=>alert(label + ' のURLをコピーしました'))
      .catch(()=>alert('URL: ' + url));
  };

  const urlRow = (label, icon, url, desc, color, bg) => (
    <div style={{background:bg,border:`1px solid ${color}30`,borderRadius:'var(--rs)',padding:'14px 16px',marginBottom:10}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
        <span style={{fontSize:18}}>{icon}</span>
        <div style={{fontWeight:700,fontSize:13,color}}>{label}</div>
      </div>
      <div style={{fontSize:11,color:'var(--tx2)',marginBottom:8,lineHeight:1.6}}>{desc}</div>
      <div style={{background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',padding:'7px 10px',
        fontSize:11,fontFamily:"'DM Mono',monospace",wordBreak:'break-all',color:'var(--tx2)',marginBottom:8}}>
        {url}
      </div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-xs btn-ghost" onClick={()=>copy(url,label)}>📋 コピー</button>
        <a href={url} target="_blank" rel="noopener" className="btn btn-xs btn-ghost">↗ 開く</a>
      </div>
    </div>
  );

  return(
    <div className="admin-sec" style={{marginTop:12}}>
      <div className="admin-title" style={{marginBottom:14}}>🔗 各ページのURL</div>
      <p style={{fontSize:12,color:'var(--tx2)',marginBottom:14,lineHeight:1.7}}>
        公開したURLをそのままQRコード化してください。顧客・研修生はトップ画面から目的のページを選べます。
      </p>
      {urlRow(
        '顧客フォーム（承諾書・アンケート）', '📋',
        formUrl,
        'QRコードに使用するURL。顧客のスマホで開いてもらいます。',
        'var(--pink)', 'var(--pink-l)'
      )}
      {urlRow(
        '研修生閲覧ページ', '👤',
        studentUrl,
        '研修生が自分の施術記録・評価を確認するURL。スタッフコードでログインします。',
        'var(--green)', 'var(--green-l)'
      )}
      <div style={{background:'var(--sf2)',borderRadius:'var(--rs)',padding:'10px 12px',fontSize:11,color:'var(--tx3)',lineHeight:1.7}}>
        💡 このスタッフ管理画面のURLは社内のみで共有してください。
      </div>
    </div>
  );
}

/* パスワード変更 */
function AdminPassChange({showToast}){
  const [cur,setCur]=useState('');
  const [n1,setN1]=useState('');
  const [n2,setN2]=useState('');
  const [err,setErr]=useState('');
  const [show,setShow]=useState(false);
  const save=()=>{
    const adminPass=LS.get('nail_admin_pass',DEF_ADMIN_PASS);
    if(cur!==adminPass){setErr('現在のパスワードが正しくありません');return;}
    if(n1.length<4){setErr('新しいパスワードは4文字以上にしてください');return;}
    if(n1!==n2){setErr('新しいパスワードが一致しません');return;}
    LS.set('nail_admin_pass',n1);
    setCur('');setN1('');setN2('');setErr('');
    showToast('パスワードを変更しました');
  };
  return(
    <div className="admin-sec" style={{marginTop:12}}>
      <div className="admin-title">管理パスワードの変更</div>
      <div style={{display:'flex',flexDirection:'column',gap:8,maxWidth:360}}>
        <div className="fg"><label className="flabel">現在のパスワード</label>
          <input type={show?'text':'password'} value={cur} onChange={e=>{setCur(e.target.value);setErr('');}} style={{letterSpacing:'.08em'}}/>
        </div>
        <div className="fg"><label className="flabel">新しいパスワード（4文字以上）</label>
          <input type={show?'text':'password'} value={n1} onChange={e=>{setN1(e.target.value);setErr('');}} style={{letterSpacing:'.08em'}}/>
        </div>
        <div className="fg"><label className="flabel">新しいパスワード（確認）</label>
          <input type={show?'text':'password'} value={n2} onChange={e=>{setN2(e.target.value);setErr('');}} style={{letterSpacing:'.08em'}}/>
        </div>
        {err&&<div style={{fontSize:12,color:'var(--red)'}}>{err}</div>}
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-sm btn-primary" onClick={save}>変更する</button>
          <button onClick={()=>setShow(v=>!v)} style={{background:'none',border:'none',fontSize:12,color:'var(--tx3)',cursor:'pointer'}}>{show?'非表示':'表示'}</button>
        </div>
        <div style={{fontSize:11,color:'var(--tx3)'}}>初期パスワード：{DEF_ADMIN_PASS}（変更推奨）</div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   ADMIN SCREEN
══════════════════════════════════════ */
function AdminScreen({locations,setLocations,menus,setMenus,traineesByLoc,setTraineesByLoc,consentItems,setConsentItems,showToast}){
  const [selLoc,setSelLoc]=useState(locations[0]?.id||'');
  const [newMenu,setNewMenu]=useState('');
  const [newMTime,setNewMTime]=useState(90);
  const [editMenu,setEditMenu]=useState(null);
  const [newTName,setNewTName]=useState('');
  const [newTCode,setNewTCode]=useState('');
  const [editT,setEditT]=useState(null);
  const [editLoc,setEditLoc]=useState(null);
  const [newCI,setNewCI]=useState('');

  const cur=traineesByLoc[selLoc]||[];
  const locColors=[{c:'#d4607a',bg:'#fceef2'},{c:'#2674b0',bg:'#e8f3fb'},{c:'#2e8c5e',bg:'#e8f5ee'},{c:'#c47d20',bg:'#fdf3e3'},{c:'#7c3aed',bg:'#f0ebff'},{c:'#6b6558',bg:'#f1ede8'}];

  return(
    <div>
      {/* Locations */}
      <div className="admin-sec" style={{marginBottom:12}}>
        <div className="admin-title">拠点設定</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:8,marginBottom:6}}>
          {locations.map(loc=>(
            <div key={loc.id} className="li" style={{borderLeft:`3px solid ${loc.color}`}}>
              {editLoc?.id===loc.id?(
                <div style={{flex:1,display:'flex',flexDirection:'column',gap:6}}>
                  <input value={editLoc.name} onChange={e=>setEditLoc(f=>({...f,name:e.target.value}))} placeholder="拠点名" style={{fontSize:13}}/>
                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    {locColors.map(({c,bg})=>(
                      <button key={c} onClick={()=>setEditLoc(f=>({...f,color:c,bg}))}
                        style={{width:20,height:20,borderRadius:'50%',background:c,border:editLoc.color===c?'2px solid #333':'2px solid transparent',cursor:'pointer',flexShrink:0}}/>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:5}}>
                    <button className="btn btn-xs btn-primary" onClick={()=>{setLocations(p=>p.map(l=>l.id===editLoc.id?{...l,...editLoc}:l));setEditLoc(null);showToast('更新しました')}}>保存</button>
                    <button className="btn btn-xs btn-ghost" onClick={()=>setEditLoc(null)}>×</button>
                  </div>
                </div>
              ):(
                <>
                  <div className="loc-color-dot" style={{background:loc.color}}/>
                  <div className="li-main"><div style={{fontWeight:600}}>{loc.name}</div></div>
                  <button className="btn btn-xs btn-ghost" style={{flexShrink:0}} onClick={()=>setEditLoc({...loc})}>編集</button>
                </>
              )}
            </div>
          ))}
        </div>
      </div>

      <div className="admin-grid">
        {/* Menus */}
        <div className="admin-sec">
          <div className="admin-title">施術メニュー</div>
          <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:10,maxHeight:260,overflowY:'auto'}}>
            {menus.map(m=>(
              <div key={m.id} className="li">
                {editMenu?.id===m.id?(
                  <div style={{flex:1,display:'flex',flexDirection:'column',gap:5}}>
                    <input value={editMenu.name} onChange={e=>setEditMenu(f=>({...f,name:e.target.value}))} style={{fontSize:12}}/>
                    <div style={{display:'flex',gap:5,alignItems:'center'}}>
                      <input type="number" value={editMenu.targetMins} onChange={e=>setEditMenu(f=>({...f,targetMins:e.target.value}))} style={{width:60,fontSize:12}}/>
                      <span style={{fontSize:11,color:'var(--tx2)'}}>分（目標）</span>
                      <button className="btn btn-xs btn-primary" onClick={()=>{setMenus(p=>p.map(m=>m.id===editMenu.id?{...m,...editMenu}:m));setEditMenu(null);showToast('更新しました')}}>保存</button>
                      <button className="btn btn-xs btn-ghost" onClick={()=>setEditMenu(null)}>×</button>
                    </div>
                  </div>
                ):(
                  <>
                    <div className="li-main"><div>{m.name}</div><div className="li-sub">目標：{m.targetMins}分</div></div>
                    <button className="btn btn-xs btn-ghost" style={{flexShrink:0}} onClick={()=>setEditMenu({...m})}>編集</button>
                    <button className="btn btn-xs btn-danger" style={{flexShrink:0}} onClick={()=>{if(window.confirm('削除しますか？'))setMenus(p=>p.filter(x=>x.id!==m.id))}}>削除</button>
                  </>
                )}
              </div>
            ))}
          </div>
          <div style={{background:'var(--sf2)',borderRadius:'var(--rs)',padding:10}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--tx2)',marginBottom:6}}>追加</div>
            <div style={{display:'flex',gap:5,alignItems:'center'}}>
              <input value={newMenu} onChange={e=>setNewMenu(e.target.value)} placeholder="メニュー名" style={{flex:1,fontSize:12}} onKeyDown={e=>e.key==='Enter'&&(newMenu.trim()&&(setMenus(p=>[...p,{id:uid(),name:newMenu.trim(),targetMins:+newMTime}]),setNewMenu(''),showToast('追加しました')))}/>
              <input type="number" value={newMTime} onChange={e=>setNewMTime(e.target.value)} style={{width:55,fontSize:12}}/>
              <span style={{fontSize:11,color:'var(--tx2)',whiteSpace:'nowrap'}}>分</span>
              <button className="btn btn-xs btn-primary" onClick={()=>{if(newMenu.trim()){setMenus(p=>[...p,{id:uid(),name:newMenu.trim(),targetMins:+newMTime}]);setNewMenu('');showToast('追加しました')}}}>追加</button>
            </div>
          </div>
        </div>

        {/* Trainees */}
        <div className="admin-sec">
          <div className="admin-title">
            研修生名簿
            <select value={selLoc} onChange={e=>setSelLoc(e.target.value)} style={{fontSize:11,padding:'2px 7px',fontWeight:400,marginLeft:'auto'}}>
              {locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:8,maxHeight:230,overflowY:'auto'}}>
            {cur.map(t=>(
              <div key={t.name} className="li">
                {editT?.orig===t.name?(
                  <div style={{flex:1,display:'flex',flexDirection:'column',gap:5}}>
                    <div style={{display:'flex',gap:5}}>
                      <input value={editT.name} onChange={e=>setEditT(f=>({...f,name:e.target.value}))} style={{flex:1,fontSize:12}} placeholder="氏名"/>
                      <input value={editT.code} onChange={e=>setEditT(f=>({...f,code:e.target.value.toUpperCase()}))} style={{width:85,fontSize:12,fontFamily:"'DM Mono',monospace"}} placeholder="コード"/>
                    </div>
                    <div style={{display:'flex',gap:5}}>
                      <button className="btn btn-xs btn-primary" onClick={()=>{setTraineesByLoc(p=>({...p,[selLoc]:(p[selLoc]||[]).map(x=>x.name===editT.orig?{name:editT.name,code:editT.code}:x)}));setEditT(null);showToast('更新しました')}}>保存</button>
                      <button className="btn btn-xs btn-ghost" onClick={()=>setEditT(null)}>×</button>
                    </div>
                  </div>
                ):(
                  <>
                    <div className="li-main"><div style={{fontWeight:500}}>{t.name}</div><div className="li-sub">{t.code||'コード未設定'}</div></div>
                    <button className="btn btn-xs btn-ghost" style={{flexShrink:0}} onClick={()=>setEditT({orig:t.name,name:t.name,code:t.code||''})}>編集</button>
                    <button className="btn btn-xs btn-danger" style={{flexShrink:0}} onClick={()=>{if(window.confirm(`「${t.name}」を削除しますか？`))setTraineesByLoc(p=>({...p,[selLoc]:(p[selLoc]||[]).filter(x=>x.name!==t.name)}))}}>削除</button>
                  </>
                )}
              </div>
            ))}
            {cur.length===0&&<p style={{fontSize:12,color:'var(--tx3)',padding:'6px 0'}}>研修生が登録されていません</p>}
          </div>
          <div style={{background:'var(--sf2)',borderRadius:'var(--rs)',padding:10}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--tx2)',marginBottom:6}}>追加</div>
            <div style={{display:'flex',gap:5,marginBottom:5}}>
              <input value={newTName} onChange={e=>setNewTName(e.target.value)} placeholder="氏名" style={{flex:1,fontSize:12}}/>
              <input value={newTCode} onChange={e=>setNewTCode(e.target.value.toUpperCase())} placeholder="スタッフコード" style={{width:90,fontSize:12,fontFamily:"'DM Mono',monospace"}}/>
            </div>
            <button className="btn btn-xs btn-primary" onClick={()=>{if(!newTName.trim())return;setTraineesByLoc(p=>({...p,[selLoc]:[...(p[selLoc]||[]),{name:newTName.trim(),code:newTCode.trim()}]}));setNewTName('');setNewTCode('');showToast('追加しました')}}>追加</button>
            <span style={{fontSize:11,color:'var(--tx3)',marginLeft:8}}>{cur.length}名登録中</span>
          </div>
        </div>
      </div>

      {/* Consent items */}
      <div className="admin-sec">
        <div className="admin-title">承諾書 同意項目</div>
        <p style={{fontSize:12,color:'var(--tx2)',marginBottom:10,lineHeight:1.7}}>顧客フォームの承諾書に表示するチェック項目です。</p>
        <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:12}}>
          {consentItems.map((item,i)=>(
            <div key={i} style={{
              background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:'var(--rs)',
              padding:'9px 12px',display:'flex',alignItems:'flex-start',gap:10
            }}>
              <span style={{fontSize:12,fontWeight:700,color:'var(--tx3)',flexShrink:0,minWidth:20,paddingTop:1}}>{i+1}.</span>
              <span style={{fontSize:12,color:'var(--tx)',flex:1,lineHeight:1.65,wordBreak:'break-all'}}>{item}</span>
              <button className="btn btn-xs btn-danger" style={{flexShrink:0,marginTop:1}}
                onClick={()=>setConsentItems(p=>p.filter((_,j)=>j!==i))}>削除</button>
            </div>
          ))}
          {consentItems.length===0&&(
            <div style={{padding:'12px',background:'var(--bg)',borderRadius:'var(--rs)',fontSize:12,color:'var(--tx3)',textAlign:'center',border:'1px dashed var(--bd2)'}}>
              項目がありません
            </div>
          )}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'flex-start'}}>
          <textarea value={newCI} onChange={e=>setNewCI(e.target.value)}
            placeholder="同意項目を入力（長文OK）"
            style={{flex:1,fontSize:12,minHeight:60,resize:'vertical'}}
            onKeyDown={e=>e.key==='Enter'&&e.ctrlKey&&newCI.trim()&&(setConsentItems(p=>[...p,newCI.trim()]),setNewCI(''),showToast('追加しました'))}/>
          <button className="btn btn-sm btn-primary" style={{flexShrink:0,marginTop:1}}
            onClick={()=>{if(newCI.trim()){setConsentItems(p=>[...p,newCI.trim()]);setNewCI('');showToast('追加しました')}}}>追加</button>
        </div>
        <p style={{fontSize:11,color:'var(--tx3)',marginTop:6}}>Ctrl+Enterでも追加できます</p>
      </div>

      {/* パスワード変更 */}
      <AdminPassChange showToast={showToast}/>

      {/* URL案内 */}
      <UrlGuide/>
    </div>
  );
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
const var_r='10px';

function App(){
  const [locId,setLocId]=useState(()=>LS.get('nail_cur_loc','loc1'));
  const [tab,setTab]=useState('timer');
  const [detailId,setDetailId]=useState(null);
  const [evalTarget,setEvalTarget]=useState(null);
  const [toast,setToast]=useState(null);
  const [page,setPage]=useState('select'); // 'select' | 'staff' | 'form' | 'student'
  const [appUnlocked,setAppUnlocked]=useState(()=>sessionStorage.getItem('nail_app_unlocked')==='1');

  const [locations,setLocations]=useState(()=>LS.get('nail_locations',DEF_LOCATIONS));
  const [menus,setMenus]=useState(()=>LS.get('nail_menus',DEF_MENUS));
  const [traineesByLoc,setTraineesByLoc]=useState(()=>LS.get('nail_trainees_v5',DEF_TRAINEES));
  const [consentItems,setConsentItems]=useState(()=>LS.get('nail_consent_items',DEF_CONSENT_ITEMS));
  const [sessions,setSessions]=useState(()=>LS.get('nail_sessions',{}));
  const [records,setRecords]=useState(()=>LS.get('nail_records',[]));
  const [dbLoading,setDbLoading]=useState(SB_READY);

  // 初回ロード: DB から最新データを取得
  useEffect(()=>{
    // 設定系はDBから読み込み
    const existing = LS.get('nail_consent_items', null);
    if(!existing || existing.length === 0) LS.set('nail_consent_items', DEF_CONSENT_ITEMS);

    if(!SB_READY){ setDbLoading(false); return; }
    (async()=>{
      try{
        const [dbSessions, dbRecords, dbLocs, dbMenus, dbTrainees, dbConsent] = await Promise.all([
          DB.getSessions(),
          DB.getRecords(),
          DB.getSetting('nail_locations', null),
          DB.getSetting('nail_menus', null),
          DB.getSetting('nail_trainees_v5', null),
          DB.getSetting('nail_consent_items', null),
        ]);
        setSessions(dbSessions);
        if(dbRecords.length > 0) setRecords(dbRecords);
        if(dbLocs) setLocations(dbLocs);
        if(dbMenus) setMenus(dbMenus);
        if(dbTrainees) setTraineesByLoc(dbTrainees);
        if(dbConsent && dbConsent.length > 0) setConsentItems(dbConsent);
      } catch(e){ console.warn('DB load error:', e); }
      finally{ setDbLoading(false); }
    })();

    // リアルタイム: セッション変更を購読
    if(SB_READY){
      const sub = sb.channel('nail_realtime')
        .on('postgres_changes',{event:'*',schema:'public',table:'nail_sessions'},async()=>{
          const latest = await DB.getSessions();
          setSessions(latest);
        })
        .on('postgres_changes',{event:'*',schema:'public',table:'nail_records'},async()=>{
          const latest = await DB.getRecords();
          setRecords(latest);
        })
        .subscribe();
      return ()=>sb.removeChannel(sub);
    }
  },[]);

  useEffect(()=>LS.set('nail_cur_loc',locId),[locId]);
  // 設定変更をDBに保存
  useEffect(()=>{LS.set('nail_locations',locations);DB.setSetting('nail_locations',locations);},[locations]);
  useEffect(()=>{LS.set('nail_menus',menus);DB.setSetting('nail_menus',menus);},[menus]);
  useEffect(()=>{LS.set('nail_trainees_v5',traineesByLoc);DB.setSetting('nail_trainees_v5',traineesByLoc);},[traineesByLoc]);
  useEffect(()=>{LS.set('nail_consent_items',consentItems);DB.setSetting('nail_consent_items',consentItems);},[consentItems]);
  // セッション・記録はDB.upsert/deleteで個別に保存するのでuseEffectは不要だがキャッシュ用に残す
  useEffect(()=>LS.set('nail_sessions',sessions),[sessions]);
  useEffect(()=>LS.set('nail_records',records),[records]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2400)};

  // ── STAFF MODE ──
  const trainees=traineesByLoc[locId]||[];
  const sk=name=>`${locId}_${name}`;
  const curLoc=locations.find(l=>l.id===locId)||locations[0];
  const pendingEval=records.filter(r=>!r.result).length;
  const runningCount=trainees.reduce((a,t)=>a+((sessions[sk(t.name)]||[]).filter(s=>s.status==='running').length),0);

  const saveEval=(form)=>{
    if(!evalTarget)return;
    const{session,trainee}=evalTarget;
    const staff=trainees.find(t=>t.name===trainee);
    const menuObj=menus.find(m=>m.name===(form.menu||session.menu));
    const rec={
      id:uid(),savedAt:Date.now(),date:today(),
      locationId:locId,trainee,staffCode:staff?.code||'',
      menu:form.menu||session.menu,
      elapsed:session.elapsed||0,
      targetMins:form.targetMins||(menuObj?.targetMins||90),
      checker:form.checker,
      result:form.result,
      note:form.note,
      consentData:session.consentData||null,
      surveyData:session.surveyData||null,
    };
    setRecords(p=>[...p,rec]);
    DB.upsertRecord(rec);
    const k=sk(trainee);
    setSessions(p=>({...p,[k]:(p[k]||[]).map(s=>s.id===session.id?{...s,status:'eval'}:s)}));
    // セッションをDBで更新
    DB.upsertSession(locId, trainee, {...session, status:'eval'});
    setEvalTarget(null);
    showToast('保存しました');
  };

  const updateRecord=(id,data)=>{
    setRecords(p=>p.map(r=>r.id===id?{...r,...data}:r));
    const rec = records.find(r=>r.id===id);
    if(rec) DB.upsertRecord({...rec,...data});
    showToast('更新しました');
  };
  const deleteRecord=id=>{
    if(!window.confirm('この記録を削除しますか？'))return;
    setRecords(p=>p.filter(r=>r.id!==id));
    DB.deleteRecord(id);
    if(detailId===id)setDetailId(null);
  };

  const detailRec=detailId?records.find(r=>r.id===detailId):null;
  const dateStr=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

  const navItems=[
    {k:'timer',l:'タイマー',badge:runningCount>0?runningCount:null},
    {k:'list',l:'記録一覧',badge:pendingEval>0?pendingEval:null},
    {k:'stats',l:'集計'},
    {k:'admin',l:'管理'},
  ];

  const handleAppUnlock=()=>{sessionStorage.setItem('nail_app_unlocked','1');setAppUnlocked(true);};

  if(page==='student') return <StudentApp onBack={()=>setPage('select')}/>;
  if(page==='staff'){
    if(!appUnlocked) return <AppLock onUnlock={handleAppUnlock}/>;
  } else {
    return <SelectPage onSelect={setPage}/>;
  }

  return(
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <div className="topbar">
        {/* Logo */}
        <div className="logo" onClick={()=>{setTab('timer');setDetailId(null)}}>
          <div className="logo-gem"><svg viewBox="0 0 16 16"><path d="M8 1L14 5L8 15L2 5Z"/></svg></div>
          <span style={{display:'none'}}>ネイル研修管理</span>
        </div>

        {/* Location switcher */}
        <div className="loc-switcher">
          {locations.map(loc=>(
            <button key={loc.id} className={`loc-sw-btn${locId===loc.id?' active':''}`}
              style={{
                background:locId===loc.id?loc.bg:'var(--sf2)',
                color:locId===loc.id?loc.color:'var(--tx3)',
                borderColor:locId===loc.id?loc.color:'transparent',
              }}
              onClick={()=>{setLocId(loc.id);setDetailId(null);setTab('timer')}}>
              {loc.name}
            </button>
          ))}
        </div>

        {/* Nav */}
        <div className="topnav">
          {navItems.map(n=>(
            <button key={n.k} className={`tnav${tab===n.k&&!detailId?' on':''}`}
              onClick={()=>{setTab(n.k);setDetailId(null)}}>
              <span>{n.l}</span>
              {n.badge&&<span className="bnum">{n.badge}</span>}
            </button>
          ))}
        </div>

        <div style={{display:'flex',alignItems:'center',gap:7}}>
          <div className="datechip">{dateStr}</div>
          <button style={{padding:'4px 10px',border:'1px solid var(--bd2)',borderRadius:'var(--rs)',background:'transparent',cursor:'pointer',fontSize:11,fontFamily:'inherit',color:'var(--tx2)'}}
            onClick={()=>{sessionStorage.removeItem('nail_app_unlocked');setAppUnlocked(false);}}>
            🔒 ロック
          </button>
        </div>
      </div>

      <div className="page">
        {detailRec&&(
          <DetailPage rec={detailRec} locations={locations} onBack={()=>setDetailId(null)} onUpdate={updateRecord}/>
        )}
        {!detailRec&&tab==='timer'&&(
          <TimerBoard locId={locId} trainees={trainees} menus={menus}
            sessions={sessions} setSessions={setSessions} records={records}
            onOpenEval={(session,trainee)=>setEvalTarget({session,trainee})}
            showToast={showToast}/>
        )}
        {!detailRec&&tab==='list'&&(
          <div className="card card-p">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <div>
                <h2 style={{fontSize:15,fontWeight:700}}>施術記録一覧</h2>
                <p style={{fontSize:11,color:'var(--tx3)',marginTop:2}}>
                  全 {records.length}件（全拠点）／ 評価待ち
                  <span style={{color:pendingEval>0?'var(--amber)':'var(--green)',fontWeight:600,marginLeft:4}}>{pendingEval}件</span>
                </p>
              </div>
            </div>
            <ListScreen records={records} onDelete={deleteRecord} onOpenDetail={id=>setDetailId(id)} locations={locations}/>
          </div>
        )}
        {!detailRec&&tab==='stats'&&(
          <div><h2 style={{fontSize:18,fontWeight:700,marginBottom:14}}>集計・分析</h2><StatsScreen records={records} locations={locations}/></div>
        )}
        {!detailRec&&tab==='admin'&&(
          <div>
            <h2 style={{fontSize:18,fontWeight:700,marginBottom:14}}>管理設定</h2>
            <AdminScreen locations={locations} setLocations={setLocations}
              menus={menus} setMenus={setMenus}
              traineesByLoc={traineesByLoc} setTraineesByLoc={setTraineesByLoc}
              consentItems={consentItems} setConsentItems={setConsentItems}
              showToast={showToast}/>
          </div>
        )}
      </div>

      {evalTarget&&(
        <EvalModal session={evalTarget.session} trainee={evalTarget.trainee}
          menus={menus} onSave={saveEval} onClose={()=>setEvalTarget(null)}/>
      )}
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

/* STUDENT PAGE */
/* ══ STUDENT HELPER FUNCTIONS ══ */
const studentGetUrlCode=()=>new URLSearchParams(window.location.search).get('code')||'';
const stFmt2=n=>String(n).padStart(2,'0');
const stFmtT=sec=>{
  if(!sec)return'—';
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),sc=sec%60;
  return h?`${h}:${stFmt2(m)}:${stFmt2(sc)}`:`${stFmt2(m)}:${stFmt2(sc)}`;
};
const stAvgS=(obj,keys)=>{
  if(!obj)return 0;
  const vs=keys.map(k=>obj[k]||0).filter(v=>v>0);
  return vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length):0;
};
const stStarsStr=n=>n>0?'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n)):'—';

const ST_KEYS={trainees:'nail_trainees_v5',records:'nail_records'};

/* ── STORAGE KEYS (共通) ── */

const ST_SURVEY_QS=[
  {k:'sq1',l:'仕上がり満足度'},{k:'sq2',l:'接客態度'},
  {k:'sq3',l:'施術中の快適さ'},{k:'sq4',l:'総合満足度'},
];
const ST_CK_CRIT=[
  {k:'ck1',l:'技術・仕上がり'},{k:'ck2',l:'衛生管理'},
  {k:'ck3',l:'手順・スピード'},{k:'ck4',l:'接客コミュニケーション'},{k:'ck5',l:'総合評価'},
];
const ST_RESULTS={pass:'合格',review:'要再確認',fail:'不合格'};


/* ── RESULT BADGE ── */
function StudentResultBadge({result}){
  if(!result)return <span className="rec-result rr-none">評価待ち</span>;
  const cls={pass:'rr-pass',review:'rr-review',fail:'rr-fail'}[result]||'rr-none';
  return <span className={`rec-result ${cls}`}>{ST_RESULTS[result]||result}</span>;
}

/* ── LOGIN SCREEN ── */
function LoginScreen({onLogin}){
  const urlCode=studentGetUrlCode().toUpperCase();
  const [code,setCode]=useState(urlCode);
  const [err,setErr]=useState('');

  const allTrainees=LS.get(ST_KEYS.trainees,{});
  const findStaff=c=>{
    for(const [locId,ts] of Object.entries(allTrainees)){
      const t=ts.find(x=>x.code&&x.code.toUpperCase()===c.toUpperCase());
      if(t)return{...t,locId};
    }
    return null;
  };

  const attempt=()=>{
    const s=findStaff(code.trim());
    if(!s){setErr('スタッフコードが見つかりません。担当講師にご確認ください。');return;}
    onLogin(s);
  };

  // auto login if valid url code
  useEffect(()=>{
    if(urlCode){
      const s=findStaff(urlCode);
      if(s)onLogin(s);
    }
  },[]);

  return(
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-gem"><svg viewBox="0 0 16 16"><path d="M8 1L14 5L8 15L2 5Z"/></svg></div>
        <div className="login-title">施術記録を確認する</div>
        <div className="login-sub">スタッフコードを入力してください</div>
        <div className="login-label">スタッフコード</div>
        <input className="login-input" type="text" value={code}
          onChange={e=>{setCode(e.target.value.toUpperCase());setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&attempt()}
          placeholder="例：TK-001" maxLength={10}
          autoComplete="off" autoCorrect="off" autoCapitalize="characters"/>
        {/* リアルタイム確認 */}
        {code.length>=3&&(()=>{
          const s=findStaff(code);
          return s?(
            <div style={{padding:'6px 10px',background:'var(--green-l)',borderRadius:'var(--rs)',fontSize:12,color:'var(--green)',fontWeight:700,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
              <span>✓</span>{s.name}
            </div>
          ):<div style={{height:8}}/>;
        })()}
        <div className="login-err">{err}</div>
        <button className="login-btn" onClick={attempt} disabled={code.trim().length<2}>
          記録を確認する →
        </button>
      </div>
    </div>
  );
}

/* ── RECORD DETAIL CARD ── */
function RecCard({rec,idx}){
  const [open,setOpen]=useState(idx===0); // 最初の1件だけ開く
  const elMin=Math.floor((rec.elapsed||0)/60);
  const diff=rec.targetMins?elMin-rec.targetMins:null;
  const surveyAvg=stAvgS(rec.surveyData,ST_SURVEY_QS.map(q=>q.k));
  const ckAvg=stAvgS(rec.ck,ST_CK_CRIT.map(c=>c.k));

  return(
    <div className="rec-card">
      <div className="rec-head" style={{cursor:'pointer'}} onClick={()=>setOpen(v=>!v)}>
        <div>
          <div className="rec-date">{rec.date}　{rec.menu||'—'}</div>
          {rec.checker&&<div style={{fontSize:11,color:'var(--tx3)',marginTop:2}}>チェック：{rec.checker}</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <StudentResultBadge result={rec.result}/>
          <span style={{fontSize:16,color:'var(--tx3)',userSelect:'none'}}>{open?'▲':'▼'}</span>
        </div>
      </div>

      {open&&(
        <div className="rec-body">
          {/* メタ情報 */}
          <div className="rec-row">
            <div className="rec-meta-item">
              <span className="rmi-lbl">施術時間</span>
              <span className={`rmi-val ${diff!==null&&diff>0?'over':'ok'}`}>{stFmtT(rec.elapsed)}</span>
            </div>
            <div className="rec-meta-item">
              <span className="rmi-lbl">目標時間</span>
              <span className="rmi-val">{rec.targetMins?rec.targetMins+'分':'—'}</span>
            </div>
            <div className="rec-meta-item">
              <span className="rmi-lbl">差分</span>
              <span className={`rmi-val ${diff!==null?(diff>0?'over':'ok'):'neutral'}`}>
                {diff!==null?(diff>0?'+':'')+diff+'分':'—'}
              </span>
            </div>
            {surveyAvg>0&&(
              <div className="rec-meta-item">
                <span className="rmi-lbl">顧客評価</span>
                <span className="mri-val" style={{fontSize:13,fontWeight:700,color:'#f59e0b'}}>
                  {'★'.repeat(Math.round(surveyAvg))} {surveyAvg.toFixed(1)}
                </span>
              </div>
            )}
          </div>

          {/* 顧客アンケート */}
          {rec.surveyData&&(
            <div className="score-sec">
              <div className="score-sec-title">顧客アンケート</div>
              <div className="score-rows">
                {ST_SURVEY_QS.map(q=>(
                  <div className="score-row-item" key={q.k}>
                    <span className="score-row-lbl">{q.l}</span>
                    <span className="score-row-stars">{stStarsStr(rec.surveyData[q.k]||0)}</span>
                    <span className="score-row-num">{rec.surveyData[q.k]||'—'}</span>
                  </div>
                ))}
                <div className="score-row-item" style={{background:'var(--sf2)',margin:'0 -12px',padding:'5px 12px',borderRadius:'0 0 var(--rs) var(--rs)'}}>
                  <span className="score-row-lbl" style={{fontWeight:700}}>平均</span>
                  <span className="score-row-stars">{stStarsStr(surveyAvg)}</span>
                  <span className="score-row-num" style={{fontWeight:700}}>{surveyAvg>0?surveyAvg.toFixed(1):'—'}</span>
                </div>
              </div>
              {rec.surveyData.comment&&(
                <div style={{marginTop:8,padding:'8px 10px',background:'var(--blue-l)',borderRadius:'var(--rs)',fontSize:12,color:'var(--tx2)',lineHeight:1.7}}>
                  顧客コメント：{rec.surveyData.comment}
                </div>
              )}
            </div>
          )}

          {/* チェック者評価 */}
          {rec.ck&&ckAvg>0&&(
            <div className="score-sec">
              <div className="score-sec-title">チェック者評価</div>
              <div className="score-rows">
                {ST_CK_CRIT.map(c=>(
                  <div className="score-row-item" key={c.k}>
                    <span className="score-row-lbl">{c.l}</span>
                    <span className="score-row-stars">{stStarsStr(rec.ck[c.k]||0)}</span>
                    <span className="score-row-num">{rec.ck[c.k]||'—'}</span>
                  </div>
                ))}
                <div className="score-row-item" style={{background:'var(--sf2)',margin:'0 -12px',padding:'5px 12px'}}>
                  <span className="score-row-lbl" style={{fontWeight:700}}>平均</span>
                  <span className="score-row-stars">{stStarsStr(ckAvg)}</span>
                  <span className="score-row-num" style={{fontWeight:700}}>{ckAvg.toFixed(1)}</span>
                </div>
              </div>
            </div>
          )}

          {/* 講師備考 */}
          {rec.note&&(
            <div className="note-box">
              <div className="note-lbl">講師コメント</div>
              <div className="note-txt">{rec.note}</div>
            </div>
          )}

          {/* 評価なし */}
          {!rec.result&&(
            <div style={{padding:'10px 12px',background:'var(--amber-l)',borderRadius:'var(--rs)',fontSize:12,color:'var(--amber)',marginTop:4}}>
              ⏳ 講師による評価を待っています
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── MAIN DASHBOARD ── */
function Dashboard({staff,onLogout,onBack}){
  const [tab,setTab]=useState('records');
  const allRecords=LS.get(ST_KEYS.records,[]);

  // このスタッフの記録だけ絞り込み
  const myRecords=useMemo(()=>
    allRecords.filter(r=>r.staffCode===staff.code)
      .sort((a,b)=>b.savedAt-a.savedAt),
    [allRecords,staff.code]
  );

  const n=myRecords.length;
  const withTime=myRecords.filter(r=>r.elapsed>0);
  const avgTime=withTime.length?Math.round(withTime.reduce((a,r)=>a+(r.elapsed||0),0)/withTime.length/60):null;
  const withSurvey=myRecords.filter(r=>r.surveyData);
  const avgSurvey=withSurvey.length
    ?(withSurvey.reduce((a,r)=>a+stAvgS(r.surveyData,ST_SURVEY_QS.map(q=>q.k)),0)/withSurvey.length).toFixed(1)
    :null;
  const evaluated=myRecords.filter(r=>r.result);
  const passN=myRecords.filter(r=>r.result==='pass').length;
  const passRate=evaluated.length?Math.round(passN/evaluated.length*100):null;

  // メニュー別平均時間
  const byMenu={};
  myRecords.forEach(r=>{
    if(r.menu&&r.elapsed>0){
      if(!byMenu[r.menu])byMenu[r.menu]={s:0,n:0};
      byMenu[r.menu].s+=r.elapsed;byMenu[r.menu].n++;
    }
  });
  const menuRows=Object.entries(byMenu).map(([name,d])=>({name,time:Math.round(d.s/d.n/60)})).sort((a,b)=>b.time-a.time);
  const maxT=Math.max(...menuRows.map(r=>r.time),1);

  // 直近の成長：直近3件 vs それ以前の平均
  const recent3=myRecords.slice(0,3).filter(r=>r.ck);
  const older=myRecords.slice(3).filter(r=>r.ck);
  const recentCkAvg=recent3.length?(recent3.reduce((a,r)=>a+stAvgS(r.ck,ST_CK_CRIT.map(c=>c.k)),0)/recent3.length).toFixed(1):null;
  const olderCkAvg=older.length?(older.reduce((a,r)=>a+stAvgS(r.ck,ST_CK_CRIT.map(c=>c.k)),0)/older.length).toFixed(1):null;

  const dateStr=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* topbar */}
      <div className="topbar">
        <div className="top-logo">
          <div className="top-gem"><svg viewBox="0 0 16 16"><path d="M8 1L14 5L8 15L2 5Z"/></svg></div>
          <span className="top-name">{staff.name}</span>
          <span className="top-code">{staff.code}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:11,color:'var(--tx3)',fontFamily:"'DM Mono',monospace"}}>{dateStr}</span>
          <button className="logout-btn" onClick={onLogout}>ログアウト</button>
          {onBack&&<button className="logout-btn" onClick={onBack}>← トップへ</button>}
        </div>
      </div>

      <div className="page">

        {/* サマリーカード */}
        <div className="summary-grid">
          <div className="sum-card">
            <div className="sum-lbl">施術件数</div>
            <div className="sum-val">{n}</div>
            <div className="sum-sub">件</div>
          </div>
          <div className="sum-card">
            <div className="sum-lbl">平均施術時間</div>
            <div className="sum-val">{avgTime??'—'}</div>
            <div className="sum-sub">分</div>
          </div>
          <div className="sum-card">
            <div className="sum-lbl">顧客評価 平均</div>
            <div className="sum-val" style={{color:'#f59e0b'}}>{avgSurvey??'—'}</div>
            <div className="sum-sub">/ 5.0</div>
          </div>
          <div className="sum-card">
            <div className="sum-lbl">合格率</div>
            <div className={`sum-val ${passRate!==null?(passRate>=80?'':''):''}` }>
              <span style={{color:passRate===null?'var(--tx3)':passRate>=80?'var(--green)':passRate>=50?'var(--amber)':'var(--red)'}}>
                {passRate!==null?passRate+'%':'—'}
              </span>
            </div>
            <div className="sum-sub">{passN}件合格 / {evaluated.length}件評価済み</div>
          </div>
        </div>

        {/* タブ */}
        <div className="tabs">
          <button className={`tab-btn${tab==='records'?' on':''}`} onClick={()=>setTab('records')}>
            施術記録 {n>0&&<span style={{fontSize:11,background:tab==='records'?'rgba(255,255,255,.2)':'var(--sf2)',borderRadius:10,padding:'1px 6px',marginLeft:4}}>{n}</span>}
          </button>
          <button className={`tab-btn${tab==='stats'?' on':''}`} onClick={()=>setTab('stats')}>
            成長グラフ
          </button>
        </div>

        {/* 施術記録タブ */}
        {tab==='records'&&(
          n===0
          ?(
            <div className="empty">
              <div className="empty-icon">📭</div>
              <div className="empty-msg">施術記録がまだありません</div>
              <div style={{fontSize:12,color:'var(--tx3)',marginTop:6}}>施術が記録されると、ここに表示されます</div>
            </div>
          ):(
            <div>
              <div className="sec-head">
                <div>
                  <div className="sec-title">施術記録一覧</div>
                  <div className="sec-sub">タップすると詳細が開きます</div>
                </div>
              </div>
              <div className="rec-list">
                {myRecords.map((r,i)=><RecCard key={r.id} rec={r} idx={i}/>)}
              </div>
            </div>
          )
        )}

        {/* 成長グラフタブ */}
        {tab==='stats'&&(
          <div>
            <div className="sec-head">
              <div>
                <div className="sec-title">成長の記録</div>
                <div className="sec-sub">スタッフコード：{staff.code}</div>
              </div>
            </div>

            {n===0?(
              <div className="empty">
                <div className="empty-icon">📈</div>
                <div className="empty-msg">データがありません</div>
              </div>
            ):(
              <>
                {/* 進捗指標 */}
                <div className="prog-wrap">
                  <div className="prog-item">
                    <span className="prog-num">{n}</span>
                    <span className="prog-lbl">総施術件数</span>
                  </div>
                  <div className="prog-item">
                    <span className={`pass-ring ${passRate!==null?(passRate>=80?'good':passRate>=50?'mid':'low'):''}`}>
                      {passRate!==null?passRate+'%':'—'}
                    </span>
                    <span className="prog-lbl">合格率</span>
                  </div>
                  {recentCkAvg&&(
                    <div className="prog-item">
                      <span className="prog-num" style={{color:'var(--green)'}}>{recentCkAvg}</span>
                      <span className="prog-lbl">直近3件の評価</span>
                    </div>
                  )}
                  {olderCkAvg&&recentCkAvg&&(
                    <div className="prog-item">
                      <span className="prog-num" style={{color:parseFloat(recentCkAvg)>=parseFloat(olderCkAvg)?'var(--green)':'var(--amber)'}}>
                        {parseFloat(recentCkAvg)>=parseFloat(olderCkAvg)?'↑':'↓'}
                        {Math.abs(parseFloat(recentCkAvg)-parseFloat(olderCkAvg)).toFixed(1)}
                      </span>
                      <span className="prog-lbl">直近 vs 以前</span>
                    </div>
                  )}
                </div>

                {/* メニュー別平均時間 */}
                {menuRows.length>0&&(
                  <div style={{background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:16,marginBottom:14,boxShadow:'var(--sh)'}}>
                    <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>メニュー別 平均施術時間</div>
                    <div className="mini-chart">
                      {menuRows.map(r=>(
                        <div key={r.name} className="mc-row">
                          <div className="mc-lbl" title={r.name}>{r.name.length>9?r.name.slice(0,8)+'…':r.name}</div>
                          <div className="mc-track"><div className="mc-fill" style={{width:`${(r.time/maxT*100).toFixed(0)}%`,background:'var(--pink)'}}/></div>
                          <div className="mc-val" style={{color:'var(--pink)'}}>{r.time}分</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* チェック評価の推移（直近8件） */}
                {(() => {
                  const ckRecs=myRecords.filter(r=>r.ck&&stAvgS(r.ck,ST_CK_CRIT.map(c=>c.k))>0).slice(0,8).reverse();
                  if(ckRecs.length<2)return null;
                  const maxCk=5;
                  return(
                    <div style={{background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:16,marginBottom:14,boxShadow:'var(--sh)'}}>
                      <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>チェック評価の推移（直近{ckRecs.length}件）</div>
                      <div className="mini-chart">
                        {ckRecs.map((r,i)=>{
                          const avg=+stAvgS(r.ck,ST_CK_CRIT.map(c=>c.k)).toFixed(1);
                          return(
                            <div key={r.id} className="mc-row">
                              <div className="mc-lbl" style={{fontFamily:"'DM Mono',monospace",fontSize:10}}>{r.date}</div>
                              <div className="mc-track"><div className="mc-fill" style={{width:`${(avg/maxCk*100).toFixed(0)}%`,background:avg>=4?'var(--green)':avg>=3?'var(--amber)':'var(--red)'}}/></div>
                              <div className="mc-val" style={{color:avg>=4?'var(--green)':avg>=3?'var(--amber)':'var(--red)'}}>{avg}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {/* 各評価項目の平均 */}
                {myRecords.some(r=>r.ck)&&(()=>{
                  const ckRecs=myRecords.filter(r=>r.ck);
                  return(
                    <div style={{background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:16,boxShadow:'var(--sh)'}}>
                      <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>評価項目別 平均スコア</div>
                      <div className="mini-chart">
                        {ST_CK_CRIT.map(c=>{
                          const avg=+(ckRecs.reduce((a,r)=>a+(r.ck?.[c.k]||0),0)/ckRecs.length).toFixed(1);
                          return(
                            <div key={c.k} className="mc-row">
                              <div className="mc-lbl">{c.l}</div>
                              <div className="mc-track"><div className="mc-fill" style={{width:`${(avg/5*100).toFixed(0)}%`,background:'var(--blue)'}}/></div>
                              <div className="mc-val" style={{color:'var(--blue)'}}>{avg>0?avg:'—'}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}
              </>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

/* ── APP ── */
function StudentApp({onBack}){
  const [staff,setStaff]=useState(null);
  if(!staff)return <LoginScreen onLogin={setStaff}/>;
  return <Dashboard staff={staff} onLogout={()=>setStaff(null)} onBack={onBack}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
