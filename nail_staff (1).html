<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ネイル研修管理 — スタッフ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1;--sf:#fff;--sf2:#f1ede8;--sf3:#e8e3dc;
  --bd:#e0dbd3;--bd2:#cbc4ba;
  --tx:#1c1a17;--tx2:#6b6558;--tx3:#a09890;
  --ac:#2a2520;--ac2:#3d3830;
  --pink:#d4607a;--pink-l:#fceef2;--pink-m:#f0b0be;
  --green:#2e8c5e;--green-l:#e8f5ee;
  --amber:#c47d20;--amber-l:#fdf3e3;
  --red:#bf3a2e;--red-l:#fdecea;
  --blue:#2674b0;--blue-l:#e8f3fb;
  --r:10px;--rs:6px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 16px rgba(0,0,0,.11),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
#root{min-height:100vh}

/* ── TOPBAR ── */
.topbar{height:52px;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.logo-gem{width:24px;height:24px;border-radius:7px;background:var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-gem svg{width:13px;height:13px;fill:#fff}
.topnav{display:flex;gap:2px;margin:0 8px}
.tnav{padding:5px 10px;border:none;background:transparent;border-radius:var(--rs);cursor:pointer;font-size:12px;font-family:inherit;color:var(--tx2);display:flex;align-items:center;gap:4px;transition:.15s;white-space:nowrap}
.tnav:hover{background:var(--sf2);color:var(--tx)}
.tnav.on{background:var(--ac);color:#fff;font-weight:500}
.tnav .bnum{background:var(--pink);color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;margin-left:2px}
.tnav.on .bnum{background:rgba(255,255,255,.25)}

/* Location switcher in topbar */
.loc-switcher{display:flex;gap:4px;align-items:center}
.loc-sw-btn{padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:.15s;font-family:inherit;white-space:nowrap}
.loc-sw-btn:hover{opacity:.85}
.loc-sw-btn.active{box-shadow:0 0 0 2px var(--ac)}
.datechip{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3);background:var(--sf2);padding:3px 8px;border-radius:var(--rs);flex-shrink:0}

/* ── PAGE ── */
.page{max-width:1200px;margin:0 auto;padding:18px 20px}

/* ── CARDS ── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card-p{padding:18px}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;margin-bottom:9px}

/* ── BTNS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ac);color:#fff;border-color:var(--ac)}.btn-primary:hover:not(:disabled){background:var(--ac2)}
.btn-ghost{background:transparent;color:var(--tx2);border-color:var(--bd2)}.btn-ghost:hover:not(:disabled){background:var(--sf2);color:var(--tx)}
.btn-pink{background:var(--pink);color:#fff;border-color:var(--pink)}.btn-pink:hover:not(:disabled){background:#be4f69}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover:not(:disabled){background:#267550}
.btn-amber{background:var(--amber);color:#fff;border-color:var(--amber)}.btn-amber:hover:not(:disabled){background:#a86a18}
.btn-danger{background:transparent;color:var(--red);border-color:#e8beba}.btn-danger:hover:not(:disabled){background:var(--red-l)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px;border-radius:4px}
.btn-block{width:100%;justify-content:center;padding:12px}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:4px}
.flabel{font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:.04em}
.req{color:var(--pink);margin-left:2px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=tel],select,textarea{border:1px solid var(--bd2);border-radius:var(--rs);padding:8px 10px;font-size:13px;background:var(--sf);color:var(--tx);font-family:inherit;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(42,37,32,.08)}
textarea{resize:vertical;min-height:72px}

/* ── STARS ── */
.stars-inp{display:flex;gap:4px}
.star{width:30px;height:30px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--sf2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.1s;color:var(--tx3)}
.star:hover,.star.on{background:#fff8e1;border-color:#f59e0b;color:#f59e0b}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.srow:last-child{border-bottom:none}
.srow-lbl{font-size:12px;color:var(--tx2);min-width:148px}
.srow-val{font-size:12px;font-weight:700;min-width:20px;font-family:'DM Mono',monospace}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.bdg-pass{background:var(--green-l);color:var(--green)}
.bdg-review{background:var(--amber-l);color:var(--amber)}
.bdg-fail{background:var(--red-l);color:var(--red)}
.bdg-none{background:var(--sf2);color:var(--tx3)}
.bdg-pending{background:var(--blue-l);color:var(--blue)}
.lc-chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}

/* ── TIMER BOARD ── */
.trainee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:.2s}
.tc.run-active{border-color:var(--pink-m)}
.tc-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--sf2);border-bottom:1px solid var(--bd)}
.tc-avatar{width:30px;height:30px;border-radius:50%;background:var(--pink-l);color:var(--pink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-name{font-size:13px;font-weight:700}
.tc-code{font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace;margin-top:1px}
.tc-sessions{padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.srow-t{display:flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);transition:.15s}
.srow-t.t-wait{background:#fff8f0;border-color:#f0d0a0}
.srow-t.t-run{background:var(--pink-l);border-color:var(--pink-m)}
.srow-t.t-done{background:var(--green-l);border-color:#a8d5bf}
.srow-t.t-eval{opacity:.7;background:var(--sf2)}
.snum{width:18px;height:18px;border-radius:50%;background:var(--sf);border:1px solid var(--bd2);font-size:10px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow-t.t-run .snum{background:var(--pink);border-color:var(--pink);color:#fff}
.srow-t.t-done .snum,.srow-t.t-eval .snum{background:var(--green);border-color:var(--green);color:#fff}
.smenu-txt{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.stimer{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;min-width:58px;text-align:right}
.stimer.run{color:var(--pink)}.stimer.over{color:var(--red)}.stimer.done{color:var(--green)}
.s-status{font-size:10px;padding:2px 6px;border-radius:10px;white-space:nowrap;font-weight:500;flex-shrink:0}
.ss-consent{background:var(--amber-l);color:var(--amber)}
.ss-running{background:var(--pink-l);color:var(--pink)}
.ss-done{background:var(--green-l);color:var(--green)}
.ss-eval{background:var(--sf2);color:var(--tx3)}
.sbtns{display:flex;gap:3px;flex-shrink:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.add-s-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:6px;border:1px dashed var(--bd2);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:12px;color:var(--tx3);font-family:inherit;transition:.15s;margin-top:3px}
.add-s-btn:hover:not(:disabled){background:var(--sf2);border-color:var(--tx3);color:var(--tx2)}
.add-s-btn:disabled{opacity:.3;cursor:not-allowed}


/* ── EVAL MODAL (simplified) ── */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--sf);border-radius:var(--r);box-shadow:var(--shm);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:mup .2s ease}
@keyframes mup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--sf);z-index:1}
.mhead-title{font-size:15px;font-weight:700}
.mhead-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.mclose{width:26px;height:26px;border-radius:50%;border:none;background:var(--sf2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0}
.mclose:hover{background:var(--bd)}
.mbody{padding:20px}
.mfoot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end;background:var(--sf)}

/* Time summary bar */
.time-sum{display:flex;margin-bottom:18px;border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden;background:var(--sf2)}
.ts-item{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--bd)}
.ts-item:last-child{border-right:none}
.ts-lbl{font-size:10px;color:var(--tx3);margin-bottom:3px}
.ts-val{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.ts-val.over{color:var(--red)}.ts-val.ok{color:var(--green)}.ts-val.n{color:var(--tx)}

/* Result buttons */
.result-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.result-btn{padding:14px 10px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--sf);cursor:pointer;text-align:center;font-family:inherit;transition:.15s}
.result-btn:hover{border-color:var(--bd2);background:var(--sf2)}
.result-btn.sel-pass{border-color:var(--green);background:var(--green-l)}
.result-btn.sel-review{border-color:var(--amber);background:var(--amber-l)}
.result-btn.sel-fail{border-color:var(--red);background:var(--red-l)}
.result-btn-label{font-size:15px;font-weight:700}
.result-btn-sub{font-size:10px;color:var(--tx3);margin-top:3px}
.sel-pass .result-btn-label{color:var(--green)}
.sel-review .result-btn-label{color:var(--amber)}
.sel-fail .result-btn-label{color:var(--red)}

/* Customer summary box */
.cust-summary{background:var(--green-l);border:1px solid #a8d5bf;border-radius:var(--rs);padding:12px 14px;margin-bottom:16px}
.survey-summary{background:var(--blue-l);border:1px solid #9bc8e8;border-radius:var(--rs);padding:12px 14px;margin-bottom:16px}

/* ── CUSTOMER PAGE ── */
.cust-page{min-height:100vh;background:linear-gradient(160deg,#fceef2 0%,#f6f4f1 55%,#e8f3fb 100%)}
.cust-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:13px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.cust-body{max-width:500px;margin:0 auto;padding:22px 16px 40px}
.cust-card{background:var(--sf);border-radius:14px;padding:22px 20px;box-shadow:var(--shm);margin-bottom:14px;border:1px solid var(--bd)}
.cust-step-hd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cust-step-num{width:27px;height:27px;border-radius:50%;background:var(--pink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cust-step-num.done{background:var(--green)}
.cust-step-title{font-size:15px;font-weight:700}
.cust-step-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.staff-confirm{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--green-l);border:1px solid #a8d5bf;border-radius:var(--rs);margin:12px 0}
.staff-confirm-name{font-weight:700;color:var(--green)}
.staff-confirm-sub{font-size:11px;color:var(--tx2);margin-top:1px}
.code-row{display:flex;gap:7px;margin-bottom:4px}
.code-row input{flex:1;font-size:17px;font-family:'DM Mono',monospace;text-align:center;letter-spacing:.1em;font-weight:700;padding:10px}
.consent-notice{background:var(--amber-l);border:1px solid #f0d090;border-radius:var(--rs);padding:11px 13px;font-size:12px;line-height:1.75;margin-bottom:14px;color:var(--tx)}
.check-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--bd);border-radius:var(--rs);cursor:pointer;transition:.12s;margin-bottom:6px}
.check-item.sel{border-color:var(--green);background:var(--green-l)}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);margin-top:1px;flex-shrink:0;cursor:pointer}
.check-item label{cursor:pointer;font-size:13px;line-height:1.5}
.form-section{margin-bottom:18px}
.form-section-title{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.success-wrap{text-align:center;padding:28px 16px}
.success-icon{font-size:52px;margin-bottom:14px}
.success-title{font-size:20px;font-weight:700;margin-bottom:6px}
.success-sub{font-size:13px;color:var(--tx2);line-height:1.75}

/* ── DETAIL PAGE ── */
.detail-hero{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:13px;box-shadow:var(--sh)}
.detail-name{font-size:20px;font-weight:700;margin-bottom:4px}
.detail-meta{font-size:12px;color:var(--tx2);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.dg-item{background:var(--sf2);border-radius:var(--rs);padding:11px}
.dg-lbl{font-size:10px;color:var(--tx3);margin-bottom:3px}
.dg-val{font-size:17px;font-weight:700;font-family:'DM Mono',monospace}
.dg-val.over{color:var(--red)}.dg-val.ok{color:var(--green)}
.detail-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px}
.score-table{width:100%;border-collapse:collapse;font-size:12px}
.score-table th{background:var(--sf2);padding:6px 9px;text-align:left;font-weight:600;font-size:10px;color:var(--tx2);border-bottom:1px solid var(--bd)}
.score-table td{padding:6px 9px;border-bottom:1px solid var(--bd)}
.score-table tr:last-child td{border-bottom:none}
.star-disp{color:#f59e0b}

/* Instructor eval — simplified */
.inst-box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-top:0;box-shadow:var(--sh)}
.inst-box.pending{border-color:var(--amber);background:#fffdf7}
.inst-box.done-e{border-color:var(--green);background:#f7fdf9}
.inst-result-display{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.inst-note-display{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 13px}
.inst-note-label{font-size:10px;color:var(--tx3);margin-bottom:3px}

/* ── LIST ── */
.list-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.list-bar input,.list-bar select{width:auto;font-size:12px;padding:5px 8px}
.sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
thead{background:var(--sf2)}
th{padding:8px 10px;text-align:left;font-weight:600;font-size:11px;color:var(--tx2);border-bottom:1px solid var(--bd);white-space:nowrap;letter-spacing:.04em}
td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f6}
.mono{font-family:'DM Mono',monospace;font-size:11px}
.empty-st{text-align:center;padding:40px;color:var(--tx3)}

/* ── STATS ── */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.sc-lbl{font-size:10px;color:var(--tx3);font-weight:500}
.sc-val{font-size:24px;font-weight:700;margin-top:4px;font-family:'DM Mono',monospace}
.sc-sub{font-size:10px;color:var(--tx3);margin-top:1px}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.cc-title{font-size:13px;font-weight:700;margin-bottom:10px}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.br{display:flex;align-items:center;gap:8px}
.bn{font-size:11px;color:var(--tx2);min-width:100px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:19px;background:var(--sf2);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .5s ease}
.bf-pink{background:var(--pink)}.bf-green{background:var(--green)}.bf-amber{background:var(--amber)}.bf-acc{background:var(--ac)}
.bv{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;min-width:40px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── ADMIN ── */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.admin-sec{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.admin-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg)}
.li-main{flex:1;min-width:0;font-size:13px}
.li-sub{font-size:10px;color:var(--tx3);margin-top:1px;font-family:'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;z-index:500;background:var(--ac);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;box-shadow:var(--shm);animation:mup .25s ease;pointer-events:none}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

@media(max-width:680px){
  .topbar{padding:0 10px;flex-wrap:wrap;height:auto;gap:6px;padding:6px 10px}
  .page{padding:10px}
  .trainee-grid{grid-template-columns:1fr}
  .sg{grid-template-columns:1fr 1fr}
  .two-col,.detail-body,.admin-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr 1fr}
  .loc-switcher{flex-wrap:wrap}

const {useState,useEffect,useRef,useCallback,useMemo}=React;

const fmt2=n=>String(n).padStart(2,'0');
const fmtT=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h?`${h}:${fmt2(m)}:${fmt2(sc)}`:`${fmt2(m)}:${fmt2(sc)}`};

};

/* ══ SUPABASE 設定 ══════════════════════════
   Supabase Dashboard > Settings > API から

const SUPABASE_URL = 'https://zdpxspwwflirvlqkpanv.supabase.co';           // 例: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_195iy6RXWVdZyHpLLqsRqA_2jC_gVpt'; // 例: sb_publishable_xxxxx...

const sb = (SUPABASE_URL !== 'https://zdpxspwwflirvlqkpanv.supabase.co')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// Supabaseが設定されているか
const SB_READY = !!sb;

/* ── DB helper ── */
const DB = {
  // 設定の読み書き
  async getSetting(key, def) {
    if(!SB_READY) return LS.get(key, def);
    const {data} = await sb.from('nail_settings').select('value').eq('key', key).single();
    return data ? data.value : def;
  },
  async setSetting(key, value) {
    LS.set(key, value); // ローカルにもキャッシュ
    if(!SB_READY) return;
    await sb.from('nail_settings').upsert({key, value, updated_at: new Date().toISOString()});
  },
  // セッション
  async getSessions() {
    if(!SB_READY) return LS.get('nail_sessions', {});
    const {data} = await sb.from('nail_sessions').select('*');
    if(!data) return LS.get('nail_sessions', {});
    // DB形式 → アプリ形式に変換
    const result = {};
    data.forEach(row => {
      const k = `${row.loc_id}_${row.trainee_name}`;
      if(!result[k]) result[k] = [];
      result[k].push({
        id: row.id,
        menu: row.menu,
        status: row.status,
        elapsed: row.elapsed,
        timerStart: row.timer_start,
        consentData: row.consent_data,
        surveyData: row.survey_data,
      });
    });
    return result;
  },
  async upsertSession(locId, traineeName, session) {
    LS.set('nail_sessions', null); // キャッシュ無効化
    if(!SB_READY) return;
    await sb.from('nail_sessions').upsert({
      id: session.id,
      loc_id: locId,
      trainee_name: traineeName,
      menu: session.menu || '',
      status: session.status,
      elapsed: session.elapsed || 0,
      timer_start: session.timerStart || null,
      consent_data: session.consentData || null,
      survey_data: session.surveyData || null,
      updated_at: new Date().toISOString(),
    });
  },
  async deleteSession(sessionId) {
    if(!SB_READY) return;
    await sb.from('nail_sessions').delete().eq('id', sessionId);
  },
  // 記録
  async getRecords() {
    if(!SB_READY) return LS.get('nail_records', []);
    const {data} = await sb.from('nail_records').select('*').order('saved_at', {ascending: false});

      savedAt: row.saved_at,

/* ══════════════════════════════════════
   LIVE TIMER
══════════════════════════════════════ */
function LiveTimer({session,className}){
  const [elapsed,setElapsed]=useState(session.elapsed||0);
  const rafRef=useRef(null);
  useEffect(()=>{
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    if(session.status==='running'&&session.timerStart){
      const base=session.elapsed||0;
      const tick=()=>{setElapsed(Math.floor((Date.now()-session.timerStart)/1000)+base);rafRef.current=requestAnimationFrame(tick)};
      rafRef.current=requestAnimationFrame(tick);
    } else {setElapsed(session.elapsed||0)}
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current)};
  },[session.status,session.timerStart,session.elapsed,session.id]);
  return <span className={className}>{fmtT(elapsed)}</span>;
}

/* ══════════════════════════════════════
   TIMER BOARD
══════════════════════════════════════ */
function TimerBoard({locId,trainees,menus,sessions,setSessions,records,onOpenEval,showToast}){
  const todayRecs=records.filter(r=>r.date===today()&&r.locationId===locId).length;
  const running=trainees.reduce((a,t)=>a+((sessions[`${locId}_${t.name}`]||[]).filter(s=>s.status==='running').length),0);
  const sk=name=>`${locId}_${name}`;
  const getSess=name=>sessions[sk(name)]||[];

  const addSess=name=>{
    const newS={id:uid(),menu:'',status:'idle',elapsed:0,timerStart:null,consentData:null,surveyData:null};
    setSessions(p=>{const k=sk(name),cur=p[k]||[];if(cur.length>=5)return p;return{...p,[k]:[...cur,newS]}});
    DB.upsertSession(locId,name,newS);
  };
  const changeMenu=(name,id,menu)=>{
    const k=sk(name);
    setSessions(p=>({...p,[k]:(p[k]||[]).map(s=>s.id===id?{...s,menu}:s)}));
    const sess=(sessions[k]||[]).find(s=>s.id===id);
    if(sess) DB.upsertSession(locId,name,{...sess,menu});
  };
  const manualStart=(name,id)=>{
    const k=sk(name),now=Date.now();
    setSessions(p=>({...p,[k]:(p[k]||[]).map(s=>s.id===id?{...s,status:'running',timerStart:now,elapsed:0}:s)}));
    const sess=(sessions[k]||[]).find(s=>s.id===id);
    if(sess) DB.upsertSession(locId,name,{...sess,status:'running',timerStart:now,elapsed:0});
  };
  const manualStop=(name,id)=>{
    const k=sk(name);
    setSessions(p=>({...p,[k]:(p[k]||[]).map(s=>{
      if(s.id!==id)return s;
      const el=s.timerStart?Math.floor((Date.now()-s.timerStart)/1000)+(s.elapsed||0):(s.elapsed||0);
      const updated={...s,status:'done',elapsed:el,timerStart:null};
      DB.upsertSession(locId,name,updated);
      return updated;
    })}));
  };
  const delSess=(name,id)=>{
    const k=sk(name);
    setSessions(p=>({...p,[k]:(p[k]||[]).filter(s=>s.id!==id)}));
    DB.deleteSession(id);
  };
  const resetDay=()=>{if(!window.confirm('本日のタイマーをリセットしますか？'))return;const n={};Object.keys(sessions).filter(k=>!k.startsWith(locId+'_')).forEach(k=>n[k]=sessions[k]);setSessions(n)};

  // customer URL display removed — use nail_form.html separately

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:700}}>本日の研修タイマー</h2>
          <p style={{fontSize:12,color:'var(--tx3)',marginTop:2}}>
            研修生 {trainees.length}名 ／ 本日 {todayRecs}件
            {running>0&&<span style={{color:'var(--pink)',fontWeight:600,marginLeft:10}}>● {running}件 計測中</span>}
          </p>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={resetDay}>リセット</button>
      </div>

      {trainees.length===0?(
        <div className="empty-st">研修生が登録されていません。管理画面で追加してください。</div>
      ):(
        <div className="trainee-grid">
          {trainees.map(t=>{
            const ss=getSess(t.name);
            const hasRun=ss.some(s=>s.status==='running');
            const done=ss.filter(s=>s.status==='done'||s.status==='eval').length;
            const ini=t.name.split(' ').map(p=>p[0]||'').join('').slice(0,2);
            return(
              <div key={t.name} className={`tc${hasRun?' run-active':''}`}>
                <div className="tc-head">
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div className="tc-avatar">{ini}</div>
                    <div>
                      <div className="tc-name">{t.name}</div>
                      <div className="tc-code">
                        {t.code?<span style={{background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:4,padding:'1px 6px'}}>{t.code}</span>:'コード未設定'}
                        <span style={{marginLeft:6}}>｜ {done}/{ss.length} 完了</span>
                      </div>
                    </div>
                  </div>
                  {hasRun&&<div className="pulse"/>}
                </div>

                <div className="tc-sessions">
                  {ss.map((s,i)=>{
                    const mObj=menus.find(m=>m.name===s.menu);
                    const tSecs=(mObj?.targetMins||90)*60;
                    const isRun=s.status==='running';
                    const isDone=s.status==='done';
                    const isEval=s.status==='eval';
                    const curEl=isRun&&s.timerStart?Math.floor((Date.now()-s.timerStart)/1000)+(s.elapsed||0):(s.elapsed||0);
                    const timerCls=`stimer${isRun?(curEl>tSecs?' over':' run'):isDone||isEval?' done':''}`;
                    const rowCls=`srow-t${isRun?' t-run':isDone?' t-done':isEval?' t-eval':s.consentData?' t-wait':''}`;
                    return(
                      <div key={s.id} className={rowCls}>
                        <div className="snum">{i+1}</div>
                        {isDone||isEval?(
                          <div className="smenu-txt">{s.menu||'未選択'}</div>
                        ):(
                          <select value={s.menu||''} onChange={e=>changeMenu(t.name,s.id,e.target.value)} disabled={isRun}
                            style={{flex:1,fontSize:11,padding:'3px 5px',border:'1px solid var(--bd2)',borderRadius:'var(--rs)',background:'var(--sf)',color:'var(--tx)'}}>
                            <option value=''>メニュー選択</option>
                            {menus.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
                          </select>
                        )}
                        <LiveTimer session={s} className={timerCls}/>
                        {/* status pill */}
                        {isEval&&<span className="s-status ss-eval">保存済</span>}
                        {isDone&&<span className="s-status ss-done">停止</span>}
                        {isRun&&<span className="s-status ss-running">● 計測中</span>}
                        {!isRun&&!isDone&&!isEval&&s.consentData&&<span className="s-status ss-consent">承諾済</span>}
                        <div className="sbtns">
                          {isEval?null
                          :isDone?<button className="btn btn-xs btn-amber" onClick={()=>onOpenEval(s,t.name)}>評価入力</button>
                          :isRun?<button className="btn btn-xs btn-pink" onClick={()=>manualStop(t.name,s.id)}>■ 停止</button>
                          :<button className="btn btn-xs btn-green" onClick={()=>manualStart(t.name,s.id)} disabled={!s.menu}>▶</button>}
                          {!isRun&&!isDone&&!isEval&&<button className="btn btn-xs btn-danger" onClick={()=>delSess(t.name,s.id)}>×</button>}
                        </div>
                      </div>
                    );
                  })}
                  <button className="add-s-btn" disabled={ss.length>=5} onClick={()=>addSess(t.name)}>
                    ＋ 施術を追加{ss.length>=5?' (上限)':''}
                  </button>
                </div>


              </div>
            );
          })}
        </div>
      )}

      <div style={{marginTop:14,padding:'11px 14px',background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'var(--r)',fontSize:12,color:'var(--tx2)',lineHeight:1.8}}>
        <strong>顧客フォームの流れ：</strong>
        顧客のスマホで <strong>nail_form.html</strong>（顧客フォーム）を開いてもらう → スタッフコードを入力 → 承諾書送信でタイマー自動スタート → アンケート送信でタイマー自動停止 → スタッフが「評価入力」から合否・備考を入力
      </div>
    </div>
  );
}

          <div className="dg-item"><div className="dg-lbl">目標時間</div><div className="dg-val">{rec.targetMins?rec.targetMins+'分':'—'}</div></div>

          <div className="dg-item"><div className="dg-lbl">顧客評価 平均</div><div className="dg-val">{surveyAvg>0?surveyAvg.toFixed(1):'—'}</div></div>
        </div>
      </div>

          <div className="sec-title">顧客アンケート {surveyAvg>0?`— 平均 ${surveyAvg.toFixed(1)}`:''}</div>
          {rec.surveyData?(
            <>
              <table className="score-table">
                <thead><tr><th>項目</th><th>評価</th><th>点</th></tr></thead>
                <tbody>
                  {SURVEY_QS.map(q=><tr key={q.k}><td>{q.l}</td><td><Stars val={rec.surveyData[q.k]||0} readOnly/></td><td className="mono">{rec.surveyData[q.k]||'—'}</td></tr>)}
                  <tr style={{background:'var(--sf2)'}}><td style={{fontWeight:600}}>平均</td><td><Stars val={surveyAvg} readOnly/></td><td className="mono" style={{fontWeight:700}}>{surveyAvg>0?surveyAvg.toFixed(1):'—'}</td></tr>

              <div>氏名：{rec.consentData.name}</div>
              {rec.consentData.phone&&<div>電話：{rec.consentData.phone}</div>}

            </div>
          ):<p style={{fontSize:12,color:'var(--tx3)'}}>承諾書データなし</p>}

      </div>

      {/* Staff evaluation */}
      <div className={`inst-box${rec.result?' done-e':' pending'}`} style={{marginTop:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div>
            <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>スタッフ評価</div>
            {rec.result?<span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 10px',borderRadius:20,fontSize:11,fontWeight:500,background:'var(--green-l)',color:'var(--green)'}}>✓ 評価済み</span>
            :<span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 10px',borderRadius:20,fontSize:11,fontWeight:500,background:'var(--amber-l)',color:'var(--amber)'}}>⏳ 評価待ち</span>}
          </div>
          {rec.result&&!editMode&&<button className="btn btn-ghost btn-sm" onClick={()=>setEditMode(true)}>編集</button>}
        </div>

        {editMode?(
          <div>
            <div className="sec-title">合否判定</div>
            <div className="result-btns" style={{marginBottom:16}}>
              <button className={`result-btn${result==='pass'?' sel-pass':''}`} onClick={()=>setResult('pass')}>

              <button className={`result-btn${result==='review'?' sel-review':''}`} onClick={()=>setResult('review')}>
                <div className="result-btn-label">△ 要確認</div><div className="result-btn-sub">Review</div>
              </button>
              <button className={`result-btn${result==='fail'?' sel-fail':''}`} onClick={()=>setResult('fail')}>
                <div className="result-btn-label">✗ 不合格</div><div className="result-btn-sub">Fail</div>
              </button>
            </div>
            <div className="fg" style={{marginBottom:14}}>
              <label className="flabel">備考・指導コメント</label>
              <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="改善点、次回への課題など"/>
            </div>
            <div style={{display:'flex',gap:7}}>
              {rec.result&&<button className="btn btn-ghost" onClick={()=>setEditMode(false)}>キャンセル</button>}
              <button className="btn btn-primary" disabled={!result||saving} onClick={doSave}>{saving?'保存中…':'保存する'}</button>
            </div>

        ):(
          <div>
            <div className="inst-result-display">{rb(rec.result)}</div>
            {rec.note&&(
              <div className="inst-note-display">
                <div className="inst-note-label">備考・指導コメント</div>
                <p style={{fontSize:13,lineHeight:1.75}}>{rec.note}</p>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   LIST SCREEN
══════════════════════════════════════ */
function ListScreen({records,onDelete,onOpenDetail,locations}){
  const [search,setSearch]=useState('');
  const [fLoc,setFLoc]=useState('');
  const [fResult,setFResult]=useState('');
  const [fDate,setFDate]=useState('');
  const [fEval,setFEval]=useState('');

  const filtered=records.filter(r=>{
    const s=search.toLowerCase();
    return(!search||[r.trainee,r.menu||'',r.checker||'',r.staffCode||''].join(' ').toLowerCase().includes(s))
      &&(!fLoc||r.locationId===fLoc)
      &&(!fResult||r.result===fResult)
      &&(!fDate||r.date===fDate)
      &&(!fEval||(fEval==='done'?!!r.result:!r.result));
  }).sort((a,b)=>b.savedAt-a.savedAt);

  const exportCSV=()=>{
    const hdr=['日付','拠点','研修生','コード','メニュー','施術時間(分)','目標(分)','差分(分)','顧客評価','合否','担当者','顧客氏名','備考'];
    const rows=filtered.map(r=>{
      const loc=locations.find(l=>l.id===r.locationId);
      const sAvg=avgS(r.surveyData,SURVEY_QS.map(q=>q.k));
      return[r.date,loc?.name||'',r.trainee,r.staffCode||'',r.menu||'',
        Math.floor((r.elapsed||0)/60),r.targetMins||'',
        r.targetMins?Math.floor((r.elapsed||0)/60)-r.targetMins:'',
        sAvg>0?sAvg.toFixed(1):'',
        RESULTS.find(x=>x.v===r.result)?.l||'',
        r.checker||'',r.consentData?.name||'',
        (r.note||'').replace(/,/g,'、')];
    });
    const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nail_${today()}.csv`;a.click();
  };

  const rb=v=>{const o=RESULTS.find(x=>x.v===v);return o?<span className={`bdg ${o.c}`}>{o.l}</span>:<span className="bdg bdg-none">—</span>};

  return(
    <div>
      <div className="list-bar">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="研修生・コード・メニューで検索" style={{width:200}}/>
        <select value={fLoc} onChange={e=>setFLoc(e.target.value)}>
          <option value=''>全拠点</option>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <select value={fResult} onChange={e=>setFResult(e.target.value)}>
          <option value=''>全判定</option>{RESULTS.map(r=><option key={r.v} value={r.v}>{r.l}</option>)}
        </select>
        <select value={fEval} onChange={e=>setFEval(e.target.value)}>
          <option value=''>全状態</option>
          <option value='done'>評価済み</option>
          <option value='pending'>評価待ち</option>
        </select>
        <input type="date" value={fDate} onChange={e=>setFDate(e.target.value)} style={{width:138}}/>
        <div className="sp"/>
        <span style={{fontSize:11,color:'var(--tx3)'}}>{filtered.length}件</span>
        <button className="btn btn-ghost btn-sm" onClick={exportCSV}>↓ CSV</button>
      </div>
      <div className="tw">
        <table>
          <thead>
            <tr>
              <th>日付</th><th>拠点</th><th>研修生</th><th>コード</th><th>メニュー</th>
              <th>施術時間</th><th>差分</th><th>顧客評価</th><th>合否</th><th style={{width:80}}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0?(
              <tr><td colSpan={10}><div className="empty-st">📭 記録がありません</div></td></tr>
            ):filtered.map(r=>{
              const mins=Math.floor((r.elapsed||0)/60);
              const diff=r.targetMins?mins-r.targetMins:null;
              const sAvg=avgS(r.surveyData,SURVEY_QS.map(q=>q.k));
              return(
                <tr key={r.id} style={{cursor:'pointer'}} onClick={()=>onOpenDetail(r.id)}>
                  <td className="mono">{r.date}</td>
                  <td><LocChip locId={r.locationId} locations={locations}/></td>
                  <td style={{fontWeight:500,whiteSpace:'nowrap'}}>{r.trainee}</td>
                  <td><span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:'var(--tx3)',background:'var(--sf2)',padding:'1px 6px',borderRadius:3}}>{r.staffCode||'—'}</span></td>
                  <td style={{color:'var(--tx2)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.menu||'—'}</td>
                  <td className="mono">{fmtT(r.elapsed||0)}</td>
                  <td className="mono" style={{color:diff>0?'var(--red)':diff<0?'var(--green)':'var(--tx2)'}}>
                    {diff!==null?(diff>0?'+':'')+diff+'分':'—'}
                  </td>
                  <td><span style={{color:'#f59e0b'}}>{sAvg>0?'★'.repeat(Math.round(sAvg)):''}</span><span style={{color:'var(--tx2)',fontSize:11}}>{sAvg>0?' '+sAvg.toFixed(1):'—'}</span></td>
                  <td>{r.result?rb(r.result):<span className="bdg bdg-pending">待ち</span>}</td>
                  <td onClick={e=>e.stopPropagation()}>
                    <div style={{display:'flex',gap:3}}>
                      <button className="btn btn-xs btn-ghost" onClick={()=>onOpenDetail(r.id)}>詳細</button>
                      <button className="btn btn-xs btn-danger" onClick={()=>onDelete(r.id)}>削除</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   STATS
══════════════════════════════════════ */
function StatsScreen({records,locations}){
  const [fLoc,setFLoc]=useState('');
  const d=fLoc?records.filter(r=>r.locationId===fLoc):records;
  const n=d.length;
  const wt=d.filter(r=>r.elapsed>0);
  const avgTime=wt.length?Math.round(wt.reduce((a,r)=>a+(r.elapsed||0),0)/wt.length/60):null;
  const ws=d.filter(r=>r.surveyData);
  const avgS2=ws.length?(ws.reduce((a,r)=>a+avgS(r.surveyData,SURVEY_QS.map(q=>q.k)),0)/ws.length).toFixed(1):null;
  const passN=d.filter(r=>r.result==='pass').length;
  const passRate=n?Math.round(passN/n*100):null;

  const byLoc={};locations.forEach(l=>{byLoc[l.id]={name:l.name,color:l.color,cnt:0}});
  d.forEach(r=>{if(byLoc[r.locationId])byLoc[r.locationId].cnt++});
  const locRows=Object.values(byLoc).filter(x=>x.cnt>0);
  const maxLC=Math.max(...locRows.map(x=>x.cnt),1);

  const byT={};d.forEach(r=>{if(!byT[r.trainee])byT[r.trainee]={cnt:0,pass:0};byT[r.trainee].cnt++;if(r.result==='pass')byT[r.trainee].pass++});
  const tRows=Object.entries(byT).map(([name,x])=>({name,rate:x.cnt?Math.round(x.pass/x.cnt*100):0,cnt:x.cnt})).sort((a,b)=>b.rate-a.rate).slice(0,10);

  const byMenu={};d.forEach(r=>{if(r.menu&&r.elapsed>0){if(!byMenu[r.menu])byMenu[r.menu]={s:0,n:0};byMenu[r.menu].s+=r.elapsed;byMenu[r.menu].n++}});
  const mRows=Object.entries(byMenu).map(([name,x])=>({name,time:Math.round(x.s/x.n/60)})).sort((a,b)=>b.time-a.time);
  const maxM=Math.max(...mRows.map(r=>r.time),1);

  const byDate={};d.forEach(r=>{if(!byDate[r.date])byDate[r.date]=0;byDate[r.date]++});
  const dRows=Object.entries(byDate).sort((a,b)=>a[0].localeCompare(b[0])).slice(-10);
  const maxD=Math.max(...dRows.map(r=>r[1]),1);

  return(
    <div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:13}}>
        <span style={{fontSize:13,fontWeight:500}}>絞り込み：</span>
        <select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={{fontSize:12,padding:'5px 9px',border:'1px solid var(--bd2)',borderRadius:'var(--rs)',background:'var(--sf)'}}>
          <option value=''>全拠点</option>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <span style={{fontSize:11,color:'var(--tx3)'}}>{n}件</span>
      </div>
      <div className="sg">
        <div className="sc"><div className="sc-lbl">総施術記録</div><div className="sc-val">{n}</div><div className="sc-sub">件</div></div>
        <div className="sc"><div className="sc-lbl">平均施術時間</div><div className="sc-val">{avgTime??'—'}</div><div className="sc-sub">分</div></div>
        <div className="sc"><div className="sc-lbl">顧客評価 平均</div><div className="sc-val">{avgS2??'—'}</div><div className="sc-sub">/ 5.0</div></div>
        <div className="sc"><div className="sc-lbl">合格率</div><div className="sc-val">{passRate!==null?passRate+'%':'—'}</div><div className="sc-sub">{passN}件 / {n}件</div></div>
      </div>
      <div className="two-col">
        <div className="cc"><div className="cc-title">拠点別 施術件数</div>
          {locRows.length===0?<p style={{fontSize:12,color:'var(--tx3)'}}>データなし</p>:
          <div className="bar-chart">{locRows.map(x=><div key={x.name} className="br">
            <div className="bn">{x.name}</div><div className="bt"><div className="bf" style={{width:`${(x.cnt/maxLC*100).toFixed(0)}%`,background:x.color}}/></div>
            <div className="bv">{x.cnt}件</div>
          </div>)}</div>}
        </div>
        <div className="cc"><div className="cc-title">研修生別 合格率（上位10名）</div>
          {tRows.length===0?<p style={{fontSize:12,color:'var(--tx3)'}}>データなし</p>:
          <div className="bar-chart">{tRows.map(r=><div key={r.name} className="br">
            <div className="bn">{r.name}</div><div className="bt"><div className="bf bf-green" style={{width:`${r.rate}%`}}/></div>
            <div className="bv" style={{color:'var(--green)'}}>{r.rate}%</div>
          </div>)}</div>}
        </div>
      </div>
      <div className="two-col">
        <div className="cc"><div className="cc-title">メニュー別 平均施術時間</div>
          {mRows.length===0?<p style={{fontSize:12,color:'var(--tx3)'}}>データなし</p>:
          <div className="bar-chart">{mRows.map(r=><div key={r.name} className="br">
            <div className="bn">{r.name.length>9?r.name.slice(0,8)+'…':r.name}</div>
            <div className="bt"><div className="bf bf-amber" style={{width:`${(r.time/maxM*100).toFixed(0)}%`}}/></div>
            <div className="bv" style={{color:'var(--amber)'}}>{r.time}分</div>
          </div>)}</div>}
        </div>
        <div className="cc"><div className="cc-title">日別 施術件数（直近10日）</div>
          {dRows.length===0?<p style={{fontSize:12,color:'var(--tx3)'}}>データなし</p>:
          <div className="bar-chart">{dRows.map(([date,cnt])=><div key={date} className="br">
            <div className="bn" style={{fontFamily:"'DM Mono',monospace",fontSize:10}}>{date}</div>
            <div className="bt"><div className="bf bf-acc" style={{width:`${(cnt/maxD*100).toFixed(0)}%`}}/></div>
            <div className="bv">{cnt}件</div>
          </div>)}</div>}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   ADMIN LOCK SCREEN
══════════════════════════════════════ */
function AdminLock({onUnlock,showToast}){
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [show,setShow]=useState(false);
  const adminPass=LS.get('nail_admin_pass',DEF_ADMIN_PASS);

  const attempt=()=>{
    if(pw===adminPass){onUnlock();setErr('');}
    else{setErr('パスワードが正しくありません');setPw('');}
  };

  return(
    <div className="admin-lock">
      <div className="lock-box">
        <div className="lock-icon">🔒</div>
        <div className="lock-title">管理設定</div>
        <div className="lock-sub">管理設定を開くにはパスワードが必要です</div>
        <input className="lock-input" type={show?'text':'password'} value={pw}
          onChange={e=>{setPw(e.target.value);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&attempt()}
          placeholder="パスワードを入力"/>
        <div className="lock-err">{err}</div>
        <button className="lock-btn" onClick={attempt}>確認</button>
        <button onClick={()=>setShow(v=>!v)} style={{marginTop:10,background:'none',border:'none',fontSize:12,color:'var(--tx3)',cursor:'pointer'}}>
          {show?'非表示にする':'パスワードを表示する'}
        </button>
      </div>
    </div>
  );
}
